<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212; /* Charcoal Black */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* SCREEN 1: Start Interface (Handled via CSS transitions) */
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background-color: #121212;
            z-index: 20;
            transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
            opacity: 1;
            visibility: visible;
        }

        /* Logo Header Section */
        .logo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .brand-logo {
            height: 36px;
            width: auto;
            object-fit: contain;
            filter: grayscale(0.2) contrast(1.1);
        }

        .separator {
            font-size: 18px;
            color: #5f6368;
            font-weight: 300;
        }

        /* Google Styled Start Button */
        /* Google Styled Rounded Start Button */
        /* Google Styled Rounded Start Button with Multi-Color Hover */
.google-btn {
    background-color: #1a73e8; /* Default Google Blue */
    border: 1px solid transparent;
    border-radius: 100px; /* Perfectly rounded pill shape */
    color: #ffffff; /* White text */
    font-family: "Google Sans", Roboto, arial, sans-serif;
    font-size: 14px;
    letter-spacing: 0.25px;
    margin: 11px 4px;
    padding: 0 24px; 
    line-height: 38px;
    height: 40px;
    min-width: 120px;
    text-align: center;
    display: inline-block;
    cursor: pointer;
    user-select: none;
    font-weight: 500;
    box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    
    /* Smooth transition out when leaving hover state */
    background-size: 400% 400%;
    background-image: linear-gradient(135deg, #1a73e8, #1a73e8);
    transition: background-image 0.4s ease, box-shadow 0.2s, color 0.2s;
}

    /* Hover Effect: Activates the flowing multi-color spectrum */
    .google-btn:hover {
        color: #121212; /* Darkens text slightly so it remains readable against the light colors */
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        
        /* Seamless spectrum mapping of your colors */
        background-image: linear-gradient(
            45deg, 
            #ffffff, /* White */
            #34a853, /* Green */
            #4285f4, /* Blue */
            #fbbc05, /* Yellow */
            #ea4335, /* Red */
            #ff6d00  /* Orange */
        );
        background-size: 400% 400%;
        animation: rainbowGlow 5s ease infinite;
    }

    .google-btn:active {
        transform: scale(0.98);
    }

    .google-btn:focus {
        outline: none;
    }

    /* Keyframes to smoothly fluidize and shift the color mix */
    @keyframes rainbowGlow {
        0% {
            background-position: 0% 50%;
        }
        50% {
            background-position: 100% 50%;
        }
        100% {
            background-position: 0% 50%;
        }
    }

        /* CSS-Only Page Swapper Core Mechanics */
        /* When the hidden checkbox is ticked, Screen 1 fades away */
        #interface-trigger {
            display: none;
        }

        #interface-trigger:checked ~ .start-screen {
            opacity: 0;
            transform: scale(0.95);
            visibility: hidden;
        }

        /* SCREEN 2: 3D Rotating Sphere Page */
        .sphere-screen {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Gives depth to the 3D rotating lines */
            background-color: #121212;
        }

        .sphere {
            position: relative;
            width: 220px;
            height: 220px;
            transform-style: preserve-3d;
            animation: rotateSphere 12s linear infinite;
        }

        /* When JavaScript applies the attribute, scale the animation container smoothly */
        .sphere[data-hovered="true"] {
            scale: 1.2;
            transition: scale 0.3s ease;
        }

        /* Add a fallback transition to the base .sphere style so it shrinks back smoothly */
        .sphere {
            transition: scale 0.3s ease;
        }


        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 255, 255, 0.12); /* Faint white lines */
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03); /* Tiny faint glow */
        }

        /* Rotating the rings on different 3D axes to map a globe sphere */
        .ring:nth-child(1) { transform: rotateY(0deg); }
        .ring:nth-child(2) { transform: rotateY(30deg); }
        .ring:nth-child(3) { transform: rotateY(60deg); }
        .ring:nth-child(4) { transform: rotateY(90deg); }
        .ring:nth-child(5) { transform: rotateY(120deg); }
        .ring:nth-child(6) { transform: rotateY(150deg); }
        
        /* Horizontal Latitude rings */
        .ring:nth-child(7) { transform: rotateX(90deg) translateZ(55px) scale(0.86); }
        .ring:nth-child(8) { transform: rotateX(90deg) translateZ(-55px) scale(0.86); }
        .ring:nth-child(9) { transform: rotateX(90deg) translateZ(0px); }

        /* Master CSS Animation for 3D rotation */
        @keyframes rotateSphere {
            0% {
                transform: rotateX(15deg) rotateY(0deg) rotateZ(0deg);
            }
            100% {
                transform: rotateX(15deg) rotateY(360deg) rotateZ(360deg);
            }
        }

        /* Bottom Action Bar for the Sphere Screen */
        .action-bar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 24px;
            z-index: 30; /* Keeps buttons safely clickable over the sphere layer */
        }

        /* Base button template */
        .ctrl-btn {
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn svg {
            width: 24px;
            height: 24px;
        }

        /* Mute Button Structure (Light Grey background, White logo) */
        .btn-mute {
            background-color: #2d313f; /* Premium light charcoal/grey */
        }

        .btn-mute:hover {
            background-color: #3d4254;
        }

        .btn-mute svg {
            fill: #ffffff; /* White logo */
        }

        /* Cut Call Button Structure (Red background, White logo) */
        .btn-cut {
            background-color: #ea4335; /* Google/Gemini Red */
        }

        .btn-cut:hover {
            background-color: #dc3527;
        }

        .btn-cut svg {
            fill: #ffffff; /* White logo */
        }

    </style>
</head>
<body>

    <!-- Hidden state checkbox mimicking routing via CSS labels -->
    <input type="checkbox" id="interface-trigger">

    <!-- FRONT PAGE LAYER: Landing View -->
    <div class="start-screen">
        <div class="logo-header">
            <!-- Groq Brand Asset fetched from Brandfetch CDN -->
            <img class="brand-logo" src="https://cdn.brandfetch.io/idxygbEPCQ/w/201/h/201/theme/dark/icon.png?c=1dxbfHSJFAPEGdCLU4o5B" alt="Groq Logo">
            <span class="separator">✕</span>
            <!-- Gemini Brand Asset fetched from Brandfetch CDN -->
            <img class="brand-logo" src="https://cdn.brandfetch.io/id6O2oGzv-/w/800/h/817/theme/dark/symbol.png?c=1dxbfHSJFAPEGdCLU4o5B" alt="Gemini Logo">
            <span class="separator">✕</span>
            <!-- Eleven Labs Brand Asset fetched from Brandfetch CDN -->
            <img class="brand-logo" src="elevenlabs-logo-white.png" alt="11 Labs Logo">
        </div>

        <!-- The click targeting is bound via HTML label element straight into our master checkbox switcher -->
        <label for="interface-trigger" class="google-btn">Start?</label>
    </div>

    <!-- MAIN APP LAYER: Sphere Animation -->
    <div class="sphere-screen">
        <div class="sphere">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>

        <!-- NEW: Bottom Action Control Bar -->
        <div class="action-bar">
            <!-- Mute Button -->
            <button class="ctrl-btn btn-mute" id="mute-btn" aria-label="Mute Microphone">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1 9h2c0 .55-.45 1-1 1s-1-.45-1-1zm6-12c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>

            <!-- Cut Call Button -->
            <button class="ctrl-btn btn-cut" id="cut-btn" aria-label="End Call">
            <svg viewBox="0 0 24 24">
                <path d="M12 21c-4.41 0-8-3.59-8-8 0-.32.02-.64.07-.95l2.25.45c-.2.53-.32 1.1-.32 1.7 0 2.41 1.72 4.43 4 4.9V21zm8-8c0-.6-.12-1.17-.32-1.69l2.25-.45c.05.31.07.63.07.95 0 4.41-3.59 8-8 8v-1.9c2.28-.47 4-2.49 4-4.9zm-4.7-6.24c.33.27.61.6.83.97l-1.6 1.1c-.13-.23-.3-.43-.5-.6l1.27-1.47zM6.3 8.36c.22-.37.5-.7.83-.97l1.27 1.47c-.2.17-.37.37-.5.6l-1.6-1.1zM12 4c1.19 0 2.33.24 3.39.69l1.45-1.6A11.95 11.95 0 0 0 12 2C8.75 2 5.79 3.01 3.36 4.72l1.46 1.59C5.83 5.48 8.8 4 12 4zm0 11c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3s3 1.34 3 3v5c0 1.66-1.34 3-3 3z" style="display:none;"/>
                <!-- Clean downward hanging phone arc path -->
                <path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1.02 1.02 0 0 0-1.02.24l-2.2 2.2a15.04 15.04 0 0 1-6.59-6.59l2.2-2.21a1 1 0 0 0 .25-1.02A11.36 11.36 0 0 1 8.5 4c0-.56-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z" transform="rotate(135 12 12)"/>
            </svg>
        </button>
    </div>
    <script src="VoiceAssistantScript.js"></script>
</body>
</html>
